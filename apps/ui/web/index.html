<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS26119 Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f14'/%3E%3Cpath d='M6 24 L13 9 L19 19 L26 7' stroke='%235ce1e6' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="Dashboard">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#111821"/><path d="M6 24 L13 9 L19 19 L26 7" stroke="#5ce1e6" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="7" r="2.4" fill="#5ce1e6"/></svg>
      <span class="brand-text"><b>PS26119</b><span>Optimization Command Center</span></span>
    </a>
    <div class="topbar-status" id="sys-status">
      <span class="chip muted">connecting…</span>
    </div>
  </header>

  <nav class="rail" aria-label="Main"></nav>

  <main class="main" id="main" tabindex="-1"></main>

  <footer class="statusbar">
    <span id="sb-run" class="sb-item">no run yet</span>
    <span class="sb-sep"></span>
    <span class="sb-item muted">every number on screen comes from the solver, the verifier or a committed benchmark CSV — nothing is simulated</span>
    <span class="sb-grow"></span>
    <span id="sb-build" class="sb-item mono muted"></span>
  </footer>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
