name: cpu-ci

# CPU only. GitHub has no NVIDIA runners for this project, so GPU verification is a
# separate, recorded step on real hardware (scripts/gpu_check.sh, docs/GPU_VERIFICATION.md).

# Minutes matter (private repository; macOS minutes are billed 10×): a pull request is tested
# once, by its pull_request run (which reports the required checks); pushes are tested only on
# main. A newer push to the same PR cancels the run it supersedes. Manual runs: Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runners: GitHub-hosted by default; the repository variable CI_RUNNER=self-hosted routes every
# job to the team's self-hosted runners (label ps26119; scripts/ci_runners.sh: a macOS runner and a
# Linux runner in Docker). Job and check names stay the same, so branch protection is unchanged.
concurrency:
  group: cpu-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && (matrix.os == 'macos-latest' && fromJSON('["self-hosted","macOS","ps26119"]') || fromJSON('["self-hosted","Linux","ps26119"]')) || matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # validate_results.py checks that every CSV's commit is in the history

      - uses: actions/setup-python@v5
        if: vars.CI_RUNNER != 'self-hosted' || runner.os != 'macOS'
        with:
          python-version: "3.11"

      # setup-python's macOS builds install under /Users/runner (GitHub's image layout), which a
      # self-hosted Mac does not have: use the machine's Python 3.11 in a fresh virtual environment
      - name: Python 3.11 (self-hosted macOS)
        if: vars.CI_RUNNER == 'self-hosted' && runner.os == 'macOS'
        run: |
          python3.11 -m venv "$RUNNER_TEMP/py311"
          echo "$RUNNER_TEMP/py311/bin" >> "$GITHUB_PATH"

      - name: Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cmake ninja highspy numpy scipy

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPython3_EXECUTABLE=$(which python) -DPS26119_REQUIRE_PYTHON_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Unit + tooling tests (ctest also runs the CLI, verifier and Python tests)
        run: ctest --test-dir build --output-on-failure

      - name: No foreign solver linked
        run: scripts/check_no_solver_linked.sh build

      - name: Committed benchmark evidence has valid provenance
        run: python bench/validate_results.py --csv-only

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          - name: tsan
            flags: "-fsanitize=thread"
    name: ${{ matrix.name }}
    runs-on: ${{ vars.CI_RUNNER == 'self-hosted' && fromJSON('["self-hosted","Linux","ps26119"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        run: python -m pip install cmake ninja highspy numpy
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" -DCMAKE_C_FLAGS="${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}" -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.flags }}"
          -DPython3_EXECUTABLE=$(which python)
      - name: Build
        run: cmake --build build -j
      - name: Tests (C++ only; the Python tests load the library through ctypes)
        run: ctest --test-dir build --output-on-failure -E "python|tools|cli|bench"
      - name: CUDA sources type-check without the toolkit (clang CUDA front end + stub header)
        if: matrix.name == 'asan-ubsan'
        run: tools/check_cuda_syntax.sh
