name: cpu-ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cmake ninja highspy numpy

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=$(which python)

      - name: Build
        run: cmake --build build -j

      - name: Unit + tooling tests (ctest also runs tools/test_tools.py)
        run: ctest --test-dir build --output-on-failure

      - name: No foreign solver linked
        run: scripts/check_no_solver_linked.sh build
